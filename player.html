<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alchemy of Souls - Shaka Custom Player</title>
  <link rel="stylesheet" href="player.css">
  <!-- Load Shaka Player Core Compiled -->
  <script src="dist/shaka-player.compiled.js"></script>
</head>
<body>

  <!-- Main Player Container -->
  <div class="video-player-container" id="playerContainer">
    
    <!-- HTML5 Video Element -->
    <video id="videoElement" playsinline poster="alchemy_poster.jpg"></video>

    <!-- Buffering Spinner -->
    <div class="center-indicator">
      <div class="spinner" id="bufferingSpinner"></div>
    </div>

    <!-- Toast Notification -->
    <div class="player-toast" id="playerToast"></div>

    <!-- UI Overlay (Controls, Title, 3-dots) -->
    <div class="player-ui-overlay" id="playerOverlay">
      
      <!-- Top Bar (3 Dots Settings Button) -->
      <div class="player-top-bar">
        <button class="top-action-btn" id="settingsBtn" title="Pengaturan">
          <!-- 3-Dots Horizontal SVG Icon -->
          <svg viewBox="0 0 24 24">
            <circle cx="5" cy="12" r="2.2" />
            <circle cx="12" cy="12" r="2.2" />
            <circle cx="19" cy="12" r="2.2" />
          </svg>
        </button>

        <!-- Settings Popup Menu -->
        <div class="settings-menu" id="settingsMenu">
          <div class="settings-header">
            <span>PENGATURAN</span>
            <button class="settings-close-btn" id="settingsCloseBtn">&times;</button>
          </div>
          
          <div style="padding: 10px 18px 4px 18px; font-size: 11px; font-weight: 700; color: #888; text-transform: uppercase;">
            Kualitas & Resolusi
          </div>
          <ul class="settings-list" id="qualityList">
            <!-- Dynamically populated from Shaka variant tracks -->
            <li class="settings-item active"><span>Otomatis (Adaptif)</span><span class="badge">Auto</span></li>
          </ul>

          <div style="padding: 10px 18px 4px 18px; font-size: 11px; font-weight: 700; color: #888; text-transform: uppercase; border-top: 1px solid rgba(255,255,255,0.08);">
            Audio / Dubbing
          </div>
          <ul class="settings-list" id="audioList">
            <!-- Dynamically populated from Shaka audio tracks -->
          </ul>

          <div style="padding: 10px 18px 4px 18px; font-size: 11px; font-weight: 700; color: #888; text-transform: uppercase; border-top: 1px solid rgba(255,255,255,0.08);">
            Subtitle / Teks (C)
          </div>
          <ul class="settings-list" id="subtitleList">
            <!-- Dynamically populated from Shaka text tracks -->
          </ul>

          <div style="padding: 10px 18px 4px 18px; font-size: 11px; font-weight: 700; color: #888; text-transform: uppercase; border-top: 1px solid rgba(255,255,255,0.08);">
            Kecepatan Putar
          </div>
          <ul class="settings-list" id="speedList">
            <!-- Dynamically populated -->
          </ul>

          <div style="padding: 10px 18px 4px 18px; font-size: 11px; font-weight: 700; color: #888; text-transform: uppercase; border-top: 1px solid rgba(255,255,255,0.08);">
            Media Lokal
          </div>
          <ul class="settings-list">
            <li class="settings-item" id="btnPickLocalVideo" style="color: #4ade80;">
              <span>+ Buka File Video (.mp4 / .mkv)</span>
              <span class="badge" style="background: rgba(74,222,128,0.2); color: #4ade80;">Video</span>
            </li>
          </ul>
        </div>
      </div>

      <!-- Hidden file input for loading external subtitles (.srt / .vtt) -->
      <input type="file" id="subFileInput" accept=".srt,.vtt" style="display: none;">
      <!-- Hidden file input for loading local video files -->
      <input type="file" id="videoFileInput" accept="video/*,.mp4,.mkv,.webm" style="display: none;">

      <!-- Bottom Controls Section -->
      <div class="player-bottom-section">
        
        <!-- Episode & Title Overlay -->
        <div class="player-meta-info">
          <div class="player-episode" id="playerEpisode">Eps 1 Season 1</div>
          <div class="player-title" id="playerTitle">Alchemy of Souls</div>
        </div>

        <!-- Controls Row -->
        <div class="player-controls-row">
          
          <!-- Play / Pause Button -->
          <button class="ctrl-btn play-pause-btn" id="playPauseBtn" title="Putar / Jeda (Spasi)">
            <!-- Play Icon -->
            <svg id="playIcon" viewBox="0 0 24 24">
              <path d="M8 5v14l11-7z" />
            </svg>
            <!-- Pause Icon -->
            <svg id="pauseIcon" viewBox="0 0 24 24" style="display: none;">
              <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" />
            </svg>
          </button>

          <!-- Red Timeline / Progress Bar -->
          <div class="progress-bar-container" id="progressContainer">
            <div class="time-tooltip" id="timeTooltip">00:00</div>
            <div class="progress-track">
              <!-- Buffer progress -->
              <div class="progress-buffered" id="progressBuffered"></div>
              <!-- Red played progress (Waktu berjalan merah) -->
              <div class="progress-played" id="progressPlayed">
                <div class="progress-thumb"></div>
              </div>
            </div>
          </div>

          <!-- Time Display -->
          <div class="time-display" id="timeDisplay">00:00 / 00:00</div>

          <!-- Right Controls Group -->
          <div class="right-controls">
            
            <!-- Volume Control -->
            <div class="volume-group">
              <button class="ctrl-btn" id="muteBtn" title="Mute / Unmute (M)">
                <!-- Volume High -->
                <svg id="volumeIconHigh" viewBox="0 0 24 24">
                  <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z" />
                </svg>
                <!-- Volume Muted -->
                <svg id="volumeIconMuted" viewBox="0 0 24 24" style="display: none;">
                  <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z" />
                </svg>
              </button>
              <div class="volume-slider-wrapper">
                <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.05" value="1">
              </div>
            </div>

            <!-- Fullscreen Button (Shortkey 'F') -->
            <button class="ctrl-btn" id="fullscreenBtn" title="Layar Penuh (F)">
              <!-- Fullscreen Enter Icon -->
              <svg id="fullscreenIconEnter" viewBox="0 0 24 24">
                <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z" />
              </svg>
              <!-- Fullscreen Exit Icon -->
              <svg id="fullscreenIconExit" viewBox="0 0 24 24" style="display: none;">
                <path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-14v3h3v2h-5V5h2z" />
              </svg>
            </button>

          </div>

        </div>

      </div>

    </div>

  </div>

  <!-- Player Controller -->
  <script src="player.js"></script>

</body>
</html>
